name: Content quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test checker and offline defenses
        run: python -m unittest discover -s tests -v
      - name: Check curriculum, links and paired exams
        run: python scripts/check_content.py
      - name: Run offline examples
        run: |
          python examples/integrity_hmac.py
          python examples/parameterized_query.py
          python examples/agent_policy.py

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check source formatting
        run: npm run format:check
      - name: Test content parsing, routes, search and learning progress
        run: npm test
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Build and verify learning journeys
        run: npm run test:e2e
